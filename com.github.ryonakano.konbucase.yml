id: com.github.ryonakano.konbucase
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: com.github.ryonakano.konbucase
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/vala
modules:
  - name: chcase
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/ryonakano/chcase/archive/3.0.0.tar.gz
        sha256: ad858cf37567505811e7b8bd6300917c82e37de1da9d8642f4fc8f83f512a569

  - name: konbucase
    buildsystem: meson
    config-opts:
      - -Duse_submodule=false
      - -Dgranite=disabled
    sources:
      - type: git
        url: https://github.com/ryonakano/konbucase.git
        #tag: 5.0.0
        commit: 495cbaaec50c9770c984a63736b9e34304e56030
