id: com.github.ryonakano.konbucase
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: com.github.ryonakano.konbucase
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/vala
modules:
  - name: chcase
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/ryonakano/chcase/archive/2.4.0.tar.gz
        sha256: 73718fba76e67f7374b3573fc58e785c7ca3e9482ad1de9d29046c837fe76cac

  - name: konbucase
    buildsystem: meson
    config-opts:
      - -Duse_submodule=false
      - -Dgranite=disabled
    sources:
      - type: git
        url: https://github.com/ryonakano/konbucase.git
        tag: 4.5.1
        commit: 5050aad40955d9d202a12bedce1744475f82a49f
